version: 1
# Project declarations for the multi-agent workspace.
# Each project is a target repo that agents may modify. The control-plane repo
# (hermes-workspace itself) is intentionally NOT listed here; self-hosted work
# requires an explicit `selfHosted: true` flag.
projects:
  - id: hermes-workspace
    repo: /Users/ramon/hermes-workspace
    defaultBranch: main
    worktreeRoot: /Users/ramon/worktrees/hermes-workspace
    setup: ['pnpm install --frozen-lockfile']
    maxConcurrentWorktrees: 2
    gitRemote: ''
    selfHosted: true
    remotes:
      dev-wsl:
        repo: /home/ramonjing/repos/hermes-workspace
        worktreeRoot: /home/ramonjing/worktrees/hermes-workspace
        setup: ['pnpm install --frozen-lockfile']
