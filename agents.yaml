version: 2
agents:
  - id: orchestrator
    name: Orchestrator
    runtime: hermes
    profile: orchestrator
    wrapper: orchestrator:plan
    role: Swarm Orchestrator / Greenlight Gate
    specialty: mission routing, task decomposition, handoffs, proof contracts, human approval gates
    mission: Decompose missions into safe, proof-bearing work and route to the right specialist while preserving human greenlight control.
    modes: [plan, autoresearch, autoresearch-dispatch]
    tools: [todo, kanban, delegation, terminal, file, session_search, cronjob, skills, clarify, web]
    skills: [orchestrator-core, mission-memory-layout, gstack-for-hermes, llm-wiki, kanban-orchestrator, writing-plans, autoresearch, autoresearch-plan, autoresearch-orchestrate]
    plugins: []
    pluginToolsets: []
    mcpServers: []
    capabilities: [orchestration, decomposition, routing, proof-contracts, greenlight-gate, autoresearch-dispatch]
    preferredTaskTypes: [orchestration, planning, routing, coordination, handoff, autoresearch-dispatch]
    greenlightRequiredFor: [merge, publish, destructive, external-send, credential-change, long-running-loop]
    maxConcurrentTasks: 1
    acceptsBroadcast: true
    reviewRequired: false

  - id: researcher
    name: Researcher
    runtime: hermes
    profile: researcher
    wrapper: researcher:quick
    role: Fact-Finding Research
    specialty: establish facts, competitive analysis, data validation, source tracing, wiki-first lookup
    mission: Produce evidence-backed factual research with external verification, explicit uncertainty, and full source trails.
    modes: [quick]
    tools: [web, browser, terminal, file, vision, session_search, skills, todo]
    skills: [researcher-core, mission-memory-layout, llm-wiki, browser-harness, gstack-for-hermes, researcher-quick, arxiv, youtube-content, polymarket]
    plugins: []
    pluginToolsets: []
    mcpServers: []
    capabilities: [research, fact-establishment, source-verification, source-tracing, wiki-query]
    preferredTaskTypes: [research, competitive-analysis, data-validation, source-review, source-tracing]
    greenlightRequiredFor: [publish, external-send, long-running-loop]
    maxConcurrentTasks: 1
    acceptsBroadcast: true
    reviewRequired: false

  - id: architect
    name: Architect
    runtime: hermes
    profile: architect
    wrapper: architect:design
    role: System Architecture & Technical Specification Agent
    specialty: architecture, data models, interfaces, technical direction, executor lane selection, implementation review
    mission: Translate upstream strategy into decision-grade technical designs and choose exactly one build executor.
    modes: [design, autoresearch]
    tools: [terminal, file, web, session_search, skills, todo]
    skills: [architect-core, harden-gate, mission-memory-layout, gstack-for-hermes, llm-wiki, writing-plans, requesting-code-review, codebase-inspection, architecture-diagram, brainstorming, autoresearch, autoresearch-execute]
    plugins: []
    pluginToolsets: []
    mcpServers: []
    capabilities: [architecture, technical-specification, technical-direction, executor-lane-selection, design-review, implementation-review, content-review, interface-contracts]
    preferredTaskTypes: [design, architecture, technical-specification, tech-direction, executor-routing, implementation-review, content-review, research-challenge, autoresearch-execute]
    greenlightRequiredFor: [publish, destructive, long-running-loop]
    maxConcurrentTasks: 1
    acceptsBroadcast: true
    reviewRequired: true

  - id: developer
    name: Developer
    runtime: hermes
    profile: developer
    wrapper: developer:implement
    role: Implementation & Testing Agent
    specialty: implement approved designs, feature code, tests, and build verification
    mission: Implement approved technical specifications with tests, evidence-bearing checkpoints, and verified builds.
    modes: [implement, autoresearch]
    tools: [terminal, file, browser, web, session_search, skills, todo]
    skills: [gstack-for-hermes, mission-memory-layout, llm-wiki, test-driven-development, systematic-debugging, codebase-inspection, github-pr-workflow, requesting-code-review, receiving-code-review, executing-plans, autoresearch, autoresearch-execute]
