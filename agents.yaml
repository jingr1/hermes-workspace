    preferredTaskTypes: [implementation, testing, build-verification, bugfix, autoresearch-execute]
    greenlightRequiredFor: [merge, destructive, long-running-loop]
    maxConcurrentTasks: 1
    acceptsBroadcast: true
    reviewRequired: true

  - id: writer
    name: Writer
    runtime: hermes
    profile: writer
    wrapper: writer:author
    role: Content & Visual Deliverables Agent
    specialty: slides, HTML, video scripts, social copy, documents, visual deliverables
    mission: Transform approved designs and research into polished, audience-ready deliverables.
