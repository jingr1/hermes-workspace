version: 1
# Pipeline templates (plan «流水线模板：pipelines.yaml»).
# Templates define STRUCTURE only — stages, owning agent, dependsOn edges,
# review placement. Content is generated per-task by stage-brief.ts.
# P2a: only workspaceMode: canonical is supported (worktree lands in P2b).
pipelines:
  - id: rad
    name: Research → Architect → Developer
    workspaceMode: canonical
    stages:
      - key: research
        agent: researcher
        dependsOn: []
      - key: design
        agent: architect
        dependsOn: [research]
      - key: build
        agent: developer
        dependsOn: [design]
      - key: review
        agent: architect
        kind: review
        reworkTarget: build
        maxRework: 2
        dependsOn: [build]
      - key: harden
        agent: architect
        kind: review
        reworkTarget: build
        maxRework: 2
        dependsOn: [review]

  - id: raw
    name: Research → Architect → Writer
    workspaceMode: canonical
    stages:
      - key: research
        agent: researcher
        dependsOn: []
      - key: design
        agent: architect
        dependsOn: [research]
      - key: draft
        agent: writer
        dependsOn: [design]
      - key: review
        agent: architect
        kind: review
        reworkTarget: draft
        maxRework: 2
        dependsOn: [draft]
      - key: harden
        agent: architect
        kind: review
        reworkTarget: draft
        maxRework: 2
        dependsOn: [review]

  - id: research-adversarial
    name: Research → Architect Review
    workspaceMode: canonical
    stages:
      - key: research
        agent: researcher
        dependsOn: []
      - key: review
        agent: architect
        kind: review
        reworkTarget: research
        maxRework: 2
        dependsOn: [research]

  - id: design-implement
    name: Architect → Developer
    workspaceMode: canonical
    stages:
      - key: design
        agent: architect
        dependsOn: []
      - key: build
        agent: developer
        dependsOn: [design]
      - key: review
        agent: architect
        kind: review
        reworkTarget: build
        maxRework: 2
        dependsOn: [build]
      - key: harden
        agent: architect
        kind: review
        reworkTarget: build
        maxRework: 2
        dependsOn: [review]
