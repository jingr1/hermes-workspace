name: research_architect_developer_writer
version: 1
entry: researcher
description: |
  Research → Architect → Developer or Writer → Architect review.
  Architect chooses exactly one build executor via EXECUTOR or DELIVERABLE_TYPE
  in the checkpoint (developer for code; writer for visual/document).
  Gate C: architect REVIEW_OUTCOME=changes_requested sends work back to the
  same executor lane up to 3 times, then Human Gate.

transitions:
  - from: researcher
    "on":
      verdict: DONE
    to: architect
    reason: "调研完成，进入架构设计"

  # Terminal approval before any other architect DONE rule.
  - from: architect
    "on":
      verdict: DONE
      review_outcome: approved
    to: null
    reason: "审查通过，任务完成"

  # Gate C — review failed, retry same lane (≤3), then human.
  - from: architect
    "on":
      verdict: DONE
      review_outcome: changes_requested
      metadata:
        executor: "writer"
    to: writer
    max_iterations: 3
    reason: "Gate C: content review failed → writer revise (≤3)"

  - from: architect
    "on":
      verdict: DONE
      review_outcome: changes_requested
      metadata:
        deliverable_type: "visual,document"
    to: writer
    max_iterations: 3
    reason: "Gate C: content review failed → writer revise (≤3)"

  - from: architect
    "on":
      verdict: DONE
      review_outcome: changes_requested
    to: developer
    max_iterations: 3
    reason: "Gate C: code review failed → developer revise (≤3)"

  # Initial design → build (executor lane). Specific metadata before fallback.
  - from: architect
    "on":
      verdict: DONE
      metadata:
        executor: "writer"
    to: writer
    reason: "设计完成且 EXECUTOR=writer，进入内容创作"

  - from: architect
    "on":
      verdict: DONE
      metadata:
        deliverable_type: "visual,document"
    to: writer
    reason: "设计完成且交付物类型为 visual/document，进入内容创作"

  - from: architect
    "on":
      verdict: DONE
      metadata:
        executor: "developer"
    to: developer
    reason: "设计完成且 EXECUTOR=developer，进入开发"

  - from: architect
    "on":
      verdict: DONE
      metadata:
        deliverable_type: "code"
    to: developer
    reason: "设计完成且交付物类型为 code，进入开发"

  - from: architect
    "on":
      verdict: DONE
    to: developer
    reason: "设计完成，进入代码实现（默认）"

  - from: developer
    "on":
      verdict: DONE
    to: architect
    reason: "实现完成，交回 architect 审查"

  - from: writer
    "on":
      verdict: DONE
    to: architect
    reason: "内容创作完成，交回 architect 审查"

blockers:
  escalate:
    - architecture_decision
    - missing_credential
    - timeout
  retry:
    - missing_dependency
    - test_failure

settings:
  max_iterations: 8
  terminal_docs: false
