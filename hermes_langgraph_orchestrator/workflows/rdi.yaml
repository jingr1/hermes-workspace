name: research_design_implement
version: 1
entry: researcher
description: |
  通用 Research → Design → Implement → Review 循环。
  researcher 完成调研 → architect 设计/审查 → developer 实现 → architect 复审。
  适用于任何需要先调研、再设计、再实现的任务。

transitions:
  - from: researcher
    "on":
      verdict: DONE
    to: architect
    reason: "调研完成，进入架构设计"

  - from: architect
    "on":
      verdict: DONE
      review_outcome: approved
    to: null
    reason: "设计审查通过，任务完成"

  - from: architect
    "on":
      verdict: DONE
    to: developer
    reason: "设计完成，进入实现"

  - from: developer
    "on":
      verdict: DONE
    to: architect
    max_iterations: 3
    reason: "实现完成，交回 architect 审查"

  # 可选：审查通过后由 learning 做文档归档（terminal_docs: true 时启用）
  - from: architect
    "on":
      verdict: DONE
      review_outcome: approved
    to: learning
    terminal_docs: true
    reason: "审查通过，进入复盘/文档化"

  - from: learning
    "on":
      verdict: DONE
    to: null
    reason: "复盘/文档化完成"

blockers:
  escalate:
    - architecture_decision
    - missing_credential
    - timeout
  retry:
    - missing_dependency
    - test_failure

settings:
  max_iterations: 8
  terminal_docs: false
