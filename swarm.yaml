version: 1
workers:
  - id: orchestrator
    name: Orchestrator
    role: Swarm Orchestrator / Greenlight Gate
    specialty: mission routing, task decomposition, handoffs, proof contracts, human
      approval gates
    model: custom:nioint-gateway/DeepSeek-V4-Pro-Seed
    mission: Decompose missions into safe, proof-bearing work and route to the right
      specialist while preserving human greenlight control.
    profile: orchestrator
    modes:
      - plan
    tools:
      - todo
      - kanban
      - delegation
      - terminal
      - file
      - gbrain
      - session_search
      - cronjob
      - skills
      - clarify
      - web
    skills:
      - orchestrator-core
      - gstack-for-hermes
      - gbrain
      - kanban-orchestrator
      - subagent-driven-development
      - writing-plans
      - requesting-code-review
      - workspace-dispatch
    plugins: []
    pluginToolsets: []
    mcpServers:
      - gbrain
    wrapper: orchestrator:plan
    capabilities:
      - orchestration
      - decomposition
      - routing
      - proof-contracts
      - greenlight-gate
    preferredTaskTypes:
      - orchestration
      - planning
      - routing
      - coordination
      - handoff
    greenlightRequiredFor:
      - merge
      - publish
      - destructive
      - external-send
      - credential-change
    maxConcurrentTasks: 1
    acceptsBroadcast: true
    reviewRequired: false
