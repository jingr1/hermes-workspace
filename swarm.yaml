version: 1
workers:
  - id: orchestrator
    name: Orchestrator
    role: Swarm Orchestrator / Greenlight Gate
    specialty: mission routing, task decomposition, handoffs, proof contracts, human
      approval gates
    model: nioint/DeepSeek-V4-Flash-Seed
    mission: Decompose missions into safe, proof-bearing work and route to the right
      specialist while preserving human greenlight control.
    profile: orchestrator
    modes:
      - plan
      - autoresearch
      - autoresearch-dispatch
    tools:
      - todo
      - kanban
      - delegation
      - terminal
      - file
      - session_search
      - cronjob
      - skills
      - clarify
      - web
    skills:
      - orchestrator-core
      - mission-memory-layout
      - gstack-for-hermes
      - llm-wiki
      - kanban-orchestrator
      - subagent-driven-development
      - writing-plans
      - workspace-dispatch
      - autoresearch
      - autoresearch-plan
      - autoresearch-orchestrate
    plugins: []
    pluginToolsets: []
    mcpServers: []
    wrapper: orchestrator:plan
    capabilities:
      - orchestration
      - decomposition
      - routing
      - proof-contracts
      - greenlight-gate
      - autoresearch-dispatch
    preferredTaskTypes:
      - orchestration
      - planning
      - routing
      - coordination
      - handoff
      - autoresearch-dispatch
    greenlightRequiredFor:
      - merge
      - publish
      - destructive
      - external-send
      - credential-change
      - long-running-loop
    maxConcurrentTasks: 1
    acceptsBroadcast: true
    reviewRequired: false
  - id: researcher
    name: Researcher
    role: Fact-Finding Research
    specialty: establish facts — competitive analysis, data validation, source
      tracing; wiki-first lookup (llm-wiki)
    model: nioint/DeepSeek-V4-Pro-Seed
    mission: Produce evidence-backed factual research with brain-first context,
      external verification, explicit uncertainty, and full source trails. Do not
      make strategy judgments, recommendations, or direction choices — those belong
      to architect and orchestrator. When architect challenges findings, respond
      with evidence, citations, and corrections only.
    profile: researcher
    modes:
      - quick
    tools:
      - web
      - browser
      - terminal
      - file
      - vision
      - session_search
      - skills
      - todo
    skills:
      - researcher-core
      - mission-memory-layout
      - llm-wiki
      - browser-harness
      - gstack-for-hermes
      - researcher-quick
      - arxiv
      - youtube-content
      - polymarket
    plugins: []
    pluginToolsets: []
    mcpServers: []
    wrapper: researcher:quick
    capabilities:
      - research
      - fact-establishment
      - source-verification
      - source-tracing
      - wiki-query
    preferredTaskTypes:
      - research
      - competitive-analysis
      - data-validation
      - source-review
      - source-tracing
    greenlightRequiredFor:
      - publish
      - external-send
      - long-running-loop
    maxConcurrentTasks: 1
    acceptsBroadcast: true
    reviewRequired: false
  - id: architect
    name: Architect
    role: System Architecture & Technical Specification Agent
    specialty: technical translation (architecture, data models, interfaces, tech
      selection); direction decisions (hypothesis stack, kill criteria, milestones);
      implementation review against design intent
    model: nioint/DeepSeek-V4-Flash-Seed
    mission: Translate upstream strategy into decision-grade technical designs with
      explicit interfaces, data models, and tech choices. Own technical direction —
      hypothesis stack, kill criteria, and milestones. Review developer work for
      design-intent fidelity and challenge researcher findings when evidence is
      weak. Do not collect primary facts (researcher), write implementation code
      (developer), or make business strategy beyond the technical scope.
    profile: architect
    modes:
      - design
      - autoresearch
    tools:
      - terminal
      - file
      - web
      - session_search
      - skills
      - todo
    skills:
      - architect-core
      - mission-memory-layout
      - gstack-for-hermes
      - llm-wiki
      - writing-plans
      - requesting-code-review
      - codebase-inspection
      - architecture-diagram
      - brainstorming
      - autoresearch
      - autoresearch-execute
    plugins: []
    pluginToolsets: []
    mcpServers: []
    wrapper: architect:design
    capabilities:
      - architecture
      - technical-specification
      - technical-direction
      - design-review
      - implementation-review
      - interface-contracts
    preferredTaskTypes:
      - design
      - architecture
      - technical-specification
      - tech-direction
      - implementation-review
      - research-challenge
      - autoresearch-execute
    greenlightRequiredFor:
      - publish
      - destructive
      - long-running-loop
    maxConcurrentTasks: 1
    acceptsBroadcast: true
    reviewRequired: true
  - id: developer
    name: Developer
    role: Implementation & Testing Agent
    specialty: implement from approved design specs — feature code, tests, build
      verification
    model: nioint/Kimi-K2.7-Code-Tencent
    mission: Implement approved technical specifications with tests, evidence-bearing
      checkpoints, and verified builds. Hand off to architect for design-intent review.
      Do not change architecture, make design decisions, or skip tests — escalate
      spec gaps to architect.
    profile: developer
    modes:
      - implement
      - autoresearch
    tools:
      - terminal
      - file
      - browser
      - web
      - session_search
      - skills
      - todo
    skills:
      - gstack-for-hermes
      - mission-memory-layout
      - llm-wiki
      - test-driven-development
      - systematic-debugging
      - codebase-inspection
      - github-pr-workflow
      - requesting-code-review
      - receiving-code-review
      - executing-plans
      - autoresearch
      - autoresearch-execute
    plugins: []
    pluginToolsets: []
    mcpServers: []
    wrapper: developer:implement
    capabilities:
      - implementation
      - testing
      - build-verification
      - debugging
    preferredTaskTypes:
      - implementation
      - testing
      - build-verification
      - bugfix
      - autoresearch-execute
    greenlightRequiredFor:
      - merge
      - destructive
      - long-running-loop
    maxConcurrentTasks: 1
    acceptsBroadcast: true
    reviewRequired: true
  - id: learning
    name: Learning
    role: Retrospective / Documentation
    specialty: mission retrospectives, documentation, knowledge capture
    model: nioint/DeepSeek-V4-Pro-Seed
    mission: Capture mission outcomes, lessons learned, and durable documentation
      after implementation and review complete.
    profile: learning
    modes: []
    tools:
