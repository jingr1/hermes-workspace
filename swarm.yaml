version: 1
workers:
  - id: orchestrator
    name: Orchestrator
    role: Swarm Orchestrator / Greenlight Gate
    specialty: mission routing, task decomposition, handoffs, proof contracts, human
      approval gates
    model: deepseek/deepseek-v4-pro
    mission: Decompose missions into safe, proof-bearing work and route to the right
      specialist while preserving human greenlight control.
    profile: orchestrator
    modes:
      - plan
      - autoresearch
      - autoresearch-dispatch
    tools:
      - todo
      - kanban
      - delegation
      - terminal
      - file
      - session_search
      - cronjob
      - skills
      - clarify
      - web
    skills:
      - orchestrator-core
      - mission-memory-layout
      - gstack-for-hermes
      - llm-wiki
      - kanban-orchestrator
      - writing-plans
      - autoresearch
      - autoresearch-plan
      - autoresearch-orchestrate
    plugins: []
    pluginToolsets: []
    mcpServers: []
    wrapper: orchestrator:plan
    capabilities:
      - orchestration
      - decomposition
      - routing
      - proof-contracts
      - greenlight-gate
      - autoresearch-dispatch
    preferredTaskTypes:
      - orchestration
      - planning
      - routing
      - coordination
      - handoff
      - autoresearch-dispatch
    greenlightRequiredFor:
      - merge
      - publish
      - destructive
      - external-send
      - credential-change
      - long-running-loop
    maxConcurrentTasks: 1
    acceptsBroadcast: true
    reviewRequired: false
  - id: researcher
    name: Researcher
    role: Fact-Finding Research
    specialty: establish facts — competitive analysis, data validation, source
      tracing; wiki-first lookup (llm-wiki)
    model: deepseek/deepseek-v4-pro
    mission: Produce evidence-backed factual research with brain-first context,
      external verification, explicit uncertainty, and full source trails. Do
      not make strategy judgments, recommendations, or direction choices — those
      belong to architect and orchestrator. When architect challenges findings,
      respond with evidence, citations, and corrections only.
    profile: researcher
    modes:
      - quick
    tools:
      - web
      - browser
      - terminal
      - file
      - vision
      - session_search
      - skills
      - todo
    skills:
      - researcher-core
      - mission-memory-layout
      - llm-wiki
      - browser-harness
      - gstack-for-hermes
      - researcher-quick
      - arxiv
      - youtube-content
      - polymarket
    plugins: []
    pluginToolsets: []
    mcpServers: []
    wrapper: researcher:quick
    capabilities:
      - research
      - fact-establishment
      - source-verification
      - source-tracing
      - wiki-query
    preferredTaskTypes:
      - research
      - competitive-analysis
      - data-validation
      - source-review
      - source-tracing
    greenlightRequiredFor:
      - publish
      - external-send
      - long-running-loop
    maxConcurrentTasks: 1
    acceptsBroadcast: true
    reviewRequired: false
  - id: architect
    name: Architect
    role: System Architecture & Technical Specification Agent
    specialty: technical translation (architecture, data models, interfaces, tech
      selection); direction decisions (hypothesis stack, kill criteria,
      milestones); executor lane selection (developer | writer); review of
      implementation and content against design intent
    model: deepseek/deepseek-v4-pro
    mission: Translate upstream strategy into decision-grade technical designs with
      explicit interfaces, data models, and tech choices. Own technical
      direction — hypothesis stack, kill criteria, and milestones. After the
      spec is ready, choose exactly one build executor — `developer` for
      code/tests/build work, `writer` for docs/slides/narrative/visual
      deliverables. Do not dispatch developer and writer in parallel for the
      same mission step; if both are needed, sequence them (usually code then
      content) under a new architect decision. Review the chosen executor's
      output for design-intent fidelity and challenge researcher findings when
      evidence is weak. Do not collect primary facts (researcher), write
      implementation code (developer), author audience deliverables (writer),
      or make business strategy beyond the technical scope.
    profile: architect
    modes:
      - design
      - autoresearch
    tools:
      - terminal
      - file
      - web
      - session_search
      - skills
      - todo
    skills:
      - architect-core
      - harden-gate
      - mission-memory-layout
      - gstack-for-hermes
      - llm-wiki
      - writing-plans
      - requesting-code-review
      - codebase-inspection
      - architecture-diagram
      - brainstorming
      - autoresearch
      - autoresearch-execute
    plugins: []
    pluginToolsets: []
    mcpServers: []
    wrapper: architect:design
    capabilities:
      - architecture
      - technical-specification
      - technical-direction
      - executor-lane-selection
      - design-review
      - implementation-review
      - content-review
      - interface-contracts
    preferredTaskTypes:
      - design
      - architecture
      - technical-specification
      - tech-direction
      - executor-routing
      - implementation-review
      - content-review
      - research-challenge
      - autoresearch-execute
    greenlightRequiredFor:
      - publish
      - destructive
      - long-running-loop
    maxConcurrentTasks: 1
    acceptsBroadcast: true
    reviewRequired: true
  - id: developer
    name: Developer
    role: Implementation & Testing Agent
    specialty: implement from approved design specs — feature code, tests, build
      verification
    model: deepseek/deepseek-v4-pro
    mission: Implement approved technical specifications with tests,
      evidence-bearing checkpoints, and verified builds when architect sets
      executor=developer. Hand off to architect for design-intent review. Do
      not run in parallel with writer on the same mission step, change
      architecture, make design decisions, or skip tests — escalate spec gaps
      to architect.
    profile: developer
    modes:
      - implement
      - autoresearch
    tools:
      - terminal
      - file
      - browser
      - web
      - session_search
      - skills
      - todo
    skills:
      - gstack-for-hermes
      - mission-memory-layout
      - llm-wiki
      - test-driven-development
      - systematic-debugging
      - codebase-inspection
      - github-pr-workflow
      - requesting-code-review
      - receiving-code-review
      - executing-plans
      - autoresearch
      - autoresearch-execute
    plugins: []
    pluginToolsets: []
    mcpServers: []
    wrapper: developer:implement
    capabilities:
      - implementation
      - testing
      - build-verification
      - debugging
    preferredTaskTypes:
      - implementation
      - testing
      - build-verification
      - bugfix
      - autoresearch-execute
    greenlightRequiredFor:
      - merge
      - destructive
      - long-running-loop
    maxConcurrentTasks: 1
    acceptsBroadcast: true
    reviewRequired: true
  - id: writer
    name: Writer
    role: Content & Visual Deliverables Agent
    specialty: produce visual and narrative deliverables from approved specs —
      slides, HTML, video scripts, social copy, documents
    model: deepseek/deepseek-v4-pro
    mission: Transform approved designs and research into polished, audience-ready
      deliverables when architect sets executor=writer. Follow the architect's
      specifications for structure, tone, and format. Hand off to architect for
      quality and intent review. Do not run in parallel with developer on the
      same mission step, make architecture decisions, change technical facts,
      or skip accessibility/brand constraints — escalate content gaps to
      architect.
    profile: writer
    modes:
